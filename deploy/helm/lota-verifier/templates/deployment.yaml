# SPDX-License-Identifier: MIT
{{- if eq .Chart.AppVersion "@VERSION@" }}
{{- fail "appVersion is the @VERSION@ placeholder: install the chart make helm-package writes, or a released one." }}
{{- end }}
{{- if and .Values.requireCert (not .Values.aikCA.existingSecret) }}
{{- fail "requireCert is true but aikCA.existingSecret is unset: the verifier refuses to start without a trusted attestation-CA root. Set aikCA.existingSecret to a Secret holding the Privacy CA PEM root(s), or set requireCert=false (INSECURE)." }}
{{- end }}
{{- if and (not .Values.policy.enabled) (not .Values.allowPermissivePolicy) }}
{{- fail "no PCR policy configured: the verifier refuses to start without one. Set policy.enabled with a policy Secret/ConfigMap, or set allowPermissivePolicy=true (INSECURE)." }}
{{- end }}
{{- if and .Values.policy.enabled .Values.allowPermissivePolicy }}
{{- fail "policy.enabled and allowPermissivePolicy are mutually exclusive: choose a real policy or the permissive built-in, not both." }}
{{- end }}
{{- if and .Values.httpApi.enabled (not .Values.httpApi.auth.existingSecret) }}
{{- fail "httpApi.enabled is set but httpApi.auth.existingSecret is unset: every bind in a pod is non-loopback, and the verifier refuses a non-loopback monitoring API with no key -- which aborts startup and takes the attestation listener down with it. Set httpApi.auth.existingSecret to a Secret holding the API key(s), or leave httpApi.enabled false." }}
{{- end }}
{{- if and .Values.httpApi.auth.existingSecret (not (or .Values.httpApi.auth.readerKey .Values.httpApi.auth.adminKey)) }}
{{- fail "httpApi.auth.existingSecret names a Secret but neither httpApi.auth.readerKey nor httpApi.auth.adminKey names an entry in it, so no key would reach the verifier. Name at least one." }}
{{- end }}
{{- $sharedBackend := or .Values.postgres.existingSecret .Values.postgres.dsn }}
{{- $apiAuth := and .Values.httpApi.enabled .Values.httpApi.auth.existingSecret }}
{{- if and (gt (int .Values.replicaCount) 1) (not $sharedBackend) }}
{{- fail "replicaCount is greater than 1 with no shared backend: each replica would keep its own enforcement state, so a ban imposed on one is unknown to the others. Set postgres.existingSecret to a Secret holding the DSN (or postgres.dsn to have the chart create one), or set replicaCount=1 for a single instance." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lota-verifier.fullname" . }}
  labels:
    {{- include "lota-verifier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lota-verifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lota-verifier.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lota-verifier.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: verifier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr=:{{ .Values.service.port }}
            {{- if .Values.httpApi.enabled }}
            - --http-addr=:{{ .Values.httpApi.port }}
            {{- end }}
            - --require-cert={{ .Values.requireCert }}
            - --cert={{ .Values.tls.mountPath }}/tls.crt
            - --key={{ .Values.tls.mountPath }}/tls.key
            - --aik-store={{ .Values.dataDir }}/aiks
            {{- if .Values.aikCA.existingSecret }}
            {{- range .Values.aikCA.files }}
            - --aik-ca-cert={{ $.Values.aikCA.mountPath }}/{{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.policy.enabled }}
            - --policy={{ .Values.policy.mountPath }}/policy.yaml
            {{- if .Values.policy.pubKey }}
            - --policy-pubkey={{ .Values.policy.mountPath }}/policy.pub
            {{- end }}
            {{- end }}
            {{- if .Values.allowPermissivePolicy }}
            - --allow-permissive-policy
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $sharedBackend $apiAuth }}
          env:
            {{- if $sharedBackend }}
            # DSN carries the Postgres password, so it comes from Secret
            # and never appears in the pod's argv
            - name: LOTA_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lota-verifier.pgSecretName" . }}
                  key: {{ .Values.postgres.dsnKey }}
            {{- end }}
            {{- if $apiAuth }}
            {{- if .Values.httpApi.auth.readerKey }}
            - name: LOTA_READER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.httpApi.auth.existingSecret }}
                  key: {{ .Values.httpApi.auth.readerKey }}
            {{- end }}
            {{- if .Values.httpApi.auth.adminKey }}
            - name: LOTA_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.httpApi.auth.existingSecret }}
                  key: {{ .Values.httpApi.auth.adminKey }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: attest
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.httpApi.enabled }}
            - name: http-api
              containerPort: {{ .Values.httpApi.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            tcpSocket:
              port: attest
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: attest
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- if .Values.aikCA.existingSecret }}
            - name: aik-ca
              mountPath: {{ .Values.aikCA.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.policy.enabled }}
            - name: policy
              mountPath: {{ .Values.policy.mountPath }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: {{ .Values.dataDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- if .Values.aikCA.existingSecret }}
        - name: aik-ca
          secret:
            secretName: {{ .Values.aikCA.existingSecret }}
        {{- end }}
        {{- if .Values.policy.enabled }}
        - name: policy
          {{- if .Values.policy.existingConfigMap }}
          configMap:
            name: {{ .Values.policy.existingConfigMap }}
          {{- else }}
          secret:
            secretName: {{ .Values.policy.existingSecret }}
          {{- end }}
        {{- end }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
