name: Release

# Tag-triggered release: build the artifacts with the canonical
# reproducible-build target, hash them into a SHA256SUMS manifest, and sign
# that manifest with cosign keyless (Sigstore OIDC + Rekor).
# The signature proves the manifest -- and therefore every artifact whose
# hash it lists -- was produced by this workflow at this tag, so a downstream
# consumer can confirm "shipped lota-agent == tag".
# See Documentation/security/reproducible-builds.rst.

on:
  push:
    tags:
      - 'v*'

# one release run per tag; never cancel a release that is already publishing
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: build and sign release
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release and upload assets
      id-token: write    # OIDC token for cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm pkg-config \
            libelf-dev zlib1g-dev \
            libtss2-dev \
            libssl-dev libsystemd-dev libseccomp-dev \
            libdbus-1-dev

      - name: Install libbpf >= 1.0
        env:
          LIBBPF_VERSION: v1.4.6
        run: |
          set -eu
          git clone --depth 1 --branch "$LIBBPF_VERSION" \
            https://github.com/libbpf/libbpf.git /tmp/libbpf
          make -C /tmp/libbpf/src -j"$(nproc)"
          sudo make -C /tmp/libbpf/src install \
            PREFIX=/usr LIBDIR=/usr/lib/x86_64-linux-gnu
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/verifier/go.mod
          # a release builds the shipped artifacts; disable the module cache so
          # a poisoned cache entry cannot influence the signed output
          cache: false

      - name: Confirm the tag matches VERSION
        # check-version-tag fails when the annotated tag (vX.Y.Z) does not
        # equal the VERSION file, so a release cannot ship a version string
        # that disagrees with its tag
        run: make check-version-tag

      - name: Reproducible build
        run: make reproducible-build

      - name: Stage artifacts and hash manifest
        run: |
          set -eu
          mkdir -p release
          artifacts="lota-agent lota-install lota-verifier lota-attest-ca \
            lota-pcr14-lock liblotagaming.so liblotaserver.so \
            liblota_wine_hook.so liblota_anticheat.so lota_lsm.bpf.o"
          for a in $artifacts; do
            cp "build/$a" "release/$a"
          done
          cp VERSION release/VERSION
          (cd release && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the manifest (keyless)
        # Keyless: GitHub's OIDC token mints an ephemeral Sigstore certificate
        # bound to this workflow's identity and the signature is logged in Rekor.
        # The self-contained bundle carries the certificate and the transparency-log
        # proof, so verification needs no key distribution -- only the workflow
        # identity and the OIDC issuer (documented in Documentation/security/reproducible-builds.rst)
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          notes="Reproducible build of $TAG. Verify the artifacts with cosign"
          notes="$notes against SHA256SUMS.cosign.bundle; see Documentation/security/reproducible-builds.rst."
          # marking anything that is not a final >=1.0.0 release as a pre-release:
          # 0.x version (no stability promise yet) or a semver pre-release
          # suffix (vX.Y.Z-rc.N).
          # v1.0.0+ tag with no suffix is a normal release.
          prerelease=""
          ver="${TAG#v}"
          case "$ver" in
            0.*|*-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" \
            release/* SHA256SUMS SHA256SUMS.cosign.bundle \
            --title "$TAG" \
            --notes "$notes" \
            $prerelease

  images:
    name: push and sign container images
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write    # push to ghcr.io
      id-token: write    # OIDC token for cosign keyless signing
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/lota
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/verifier/go.mod
          cache: false

      - name: Install ko
        uses: ko-build/setup-ko@3aebd0597dc1e9d1a26bcfdb7cbeb19c131d3037 # v0.7

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: ko login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"

      - name: Build and push the images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          make container-images KO_IMAGE_TAGS="${TAG#v},latest"

      - name: Sign the images (keyless)
        # cosign resolves each tag to its pushed digest and signs that digest;
        # Sigstore certificate is bound to this workflow's OIDC identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          for image in verifier attestca; do
            cosign sign --yes "${KO_DOCKER_REPO}/${image}:${TAG#v}"
          done

  helm:
    name: package and push Helm chart
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # upload the chart to the release
      packages: write    # push the chart to the ghcr OCI registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Package the chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          helm package deploy/helm/lota-verifier \
            --version "${TAG#v}" --app-version "${TAG#v}" -d dist

      - name: Push the chart to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          helm registry login ghcr.io \
            -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
          helm push dist/*.tgz "oci://ghcr.io/$OWNER/charts"

      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.tgz --clobber

  rpms:
    name: build, sign and publish RPMs
    needs: release
    runs-on: ubuntu-24.04
    # RPM signing key lives in dedicated environment so its secrets
    # are scoped to the release job and can carry protection rules
    environment: release
    permissions:
      contents: write    # upload the packages and repo to the release
    container:
      image: fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    env:
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
      RPM_GPG_NAME: ${{ vars.RPM_GPG_NAME }}
      LOTA_REPO_BASEURL: ${{ vars.LOTA_REPO_BASEURL }}
    steps:
      - name: Install toolchain and packaging tools
        run: |
          dnf -y install \
            git make gcc clang llvm pkgconf-pkg-config \
            libbpf-devel elfutils-libelf-devel zlib-devel \
            tpm2-tss-devel openssl-devel systemd-devel libseccomp-devel \
            dbus-devel golang selinux-policy-devel \
            rpm-build rpm-sign rpmlint createrepo_c gnupg2 gh

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Build the RPMs
        run: make packages

      - name: Import the signing key
        # preset the passphrase into gpg-agent so both rpmsign and the repomd
        # signing run unattended, then let rpm's default signing command drive
        # gpg through the agent -- overriding %__gpg_sign_cmd breaks on modern
        # rpm, so then -- only %_gpg_name
        run: |
          set -eu
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          {
            echo "allow-loopback-pinentry"
            echo "allow-preset-passphrase"
          } >>"$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          keygrip=$(gpg --batch --with-keygrip --list-secret-keys "$RPM_GPG_NAME" \
            | awk '/Keygrip/ { print $3; exit }')
          /usr/libexec/gpg-preset-passphrase --preset \
            --passphrase "$RPM_GPG_PASSPHRASE" "$keygrip"
          printf '%%_gpg_name %s\n' "$RPM_GPG_NAME" >"$HOME/.rpmmacros"

      - name: Sign and build the dnf repository
        run: make dnf-repo LOTA_RPM_GPG_NAME="$RPM_GPG_NAME"

      - name: Publish the packages and repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tar -czf "lota-dnf-repo-${TAG#v}.tar.gz" -C build/dnf-repo .
          gh release upload "$TAG" \
            build/packages/*.rpm "lota-dnf-repo-${TAG#v}.tar.gz" --clobber
