name: Reproducible build

on:
  push:
    branches: [main, lota-next]
  pull_request:

permissions:
  contents: read

# cancel superseded runs of this workflow on the same ref to bound
# concurrent job usage; let pushes to main run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproducible:
    name: reproducible-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm pkg-config \
            libelf-dev zlib1g-dev \
            libtss2-dev \
            libssl-dev libsystemd-dev libseccomp-dev \
            libdbus-1-dev \
            gcc-multilib \
            diffoscope

      - name: Install libbpf >= 1.0
        env:
          LIBBPF_VERSION: v1.4.6
        run: |
          set -eu
          git clone --depth 1 --branch "$LIBBPF_VERSION" \
            https://github.com/libbpf/libbpf.git /tmp/libbpf
          make -C /tmp/libbpf/src -j"$(nproc)"
          sudo make -C /tmp/libbpf/src install \
            PREFIX=/usr LIBDIR=/usr/lib/x86_64-linux-gnu
          sudo ldconfig

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: src/verifier/go.sum

      - name: Build the tree twice under different environments
        # Both builds use the canonical reproducible-build target, which pins
        # SOURCE_DATE_EPOCH (the shared .git gives both copies the same HEAD
        # commit time), TZ and locale, into build/ as a release does.
        # They run from separate source paths and under different outer time
        # zones on purpose: the target must neutralize that environment,
        # so any path or timestamp that leaks into an artifact shows up as
        # a difference.
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE" /tmp/build-a
          cp -a "$GITHUB_WORKSPACE" /tmp/build-b
          (cd /tmp/build-a && TZ=UTC make reproducible-build &&
            make release-manifest)
          (cd /tmp/build-b && TZ=Asia/Tokyo make reproducible-build &&
            make release-manifest)

      - name: Check the version control stamp
        # a release is built from a clean checkout;
        # a Go binary stamped vcs.modified=true differs from it
        run: |
          set -eu
          go_bins=0
          for f in /tmp/build-a/build/release/* /tmp/build-b/build/release/*; do
            info=$(go version -m "$f" 2>/dev/null) || continue
            go_bins=$((go_bins + 1))
            if ! printf '%s\n' "$info" |
              grep -qx '[[:space:]]*build[[:space:]]*vcs.modified=false'; then
              printf '%s\n' "$info" | grep vcs || true
              echo "::error::$f is not stamped vcs.modified=false"
              exit 1
            fi
          done
          if [ "$go_bins" -eq 0 ]; then
            echo "::error::no Go binary in the staged release"
            exit 1
          fi

      - name: Compare artifacts
        # Enforced: any non-reproducible artifact fails the job. The build
        # is bit-for-bit reproducible (-trimpath for Go, -ffile-prefix-map
        # for C/BPF, SOURCE_DATE_EPOCH/TZ/locale pinned by the target).
        run: |
          set -u
          mkdir -p repro-report
          a=/tmp/build-a/build
          b=/tmp/build-b/build
          cat "$a/SHA256SUMS"
          if cmp -s "$a/SHA256SUMS" "$b/SHA256SUMS"; then
            echo "build is bit-for-bit reproducible"
            exit 0
          fi
          diff "$a/SHA256SUMS" "$b/SHA256SUMS"
          for f in "$a"/release/*; do
            n=${f##*/}
            if ! cmp -s "$f" "$b/release/$n"; then
              diffoscope --text "repro-report/$n.txt" \
                "$f" "$b/release/$n" || true
            fi
          done
          echo "::error::build is not bit-for-bit reproducible;" \
            "see the reproducibility-report artifact"
          exit 1

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report
          path: repro-report
          if-no-files-found: ignore

  rpm-reproducible:
    name: reproducible RPMs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install diffoscope
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope

      - name: Build the builder image
        run: make rpm-builder CONTAINER_ENGINE=docker

      - name: Build the RPMs twice under different environments
        run: |
          set -eu
          build() {
            cp -a "$GITHUB_WORKSPACE" "$1"
            docker run --rm -v "$1:$2" -w "$2" -e TZ="$3" lota-rpm-builder \
              bash -c '
                set -eu
                git config --global --add safe.directory "$PWD"
                openssl genpkey -algorithm ed25519 -out /tmp/ci.key
                openssl pkey -in /tmp/ci.key -pubout -out /tmp/ci.pub
                make reproducible-build
                make sign-bpf SIGNING_KEY=/tmp/ci.key SIGNING_PUBKEY=/tmp/ci.pub
                make packages SIGNING_KEY=/tmp/ci.key SIGNING_PUBKEY=/tmp/ci.pub
                make release-manifest-fedora'
          }
          build /tmp/rpm-a /build/a UTC
          build /tmp/rpm-b /build/deep/er/b Asia/Tokyo

      - name: Compare the packages
        run: |
          set -u
          mkdir -p repro-report
          a=/tmp/rpm-a/build
          b=/tmp/rpm-b/build
          if scripts/verify-rpm-release.sh compare \
            "$a/SHA256SUMS-fedora" "$b/SHA256SUMS-fedora"; then
            exit 0
          fi
          sudo diffoscope --text repro-report/release-fedora.txt \
            "$a/release-fedora" "$b/release-fedora" || true
          echo "::error::the RPMs are not bit-for-bit reproducible;" \
            "see the rpm-reproducibility-report artifact"
          exit 1

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-reproducibility-report
          path: repro-report
          if-no-files-found: ignore
