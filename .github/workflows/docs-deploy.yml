name: Deploy documentation

# Publishes the Sphinx HTML to GitHub Pages as two channels from one artifact.
#
# stable:      built from main, served at the site root, version label from
#              the latest stable tag (or the pushed tag itself).
# development: built from lota-next, served under /lota-next/, labelled
#              "lota-next (<short-sha>)" and marked noindex.
#
# Push to either branch (or a stable tag) rebuilds both channels and redeploys
# the combined site, so neither channel can overwrite the other.
# Release-candidate tags are skipped -- only main and stable v* tags are hosted.
on:
  push:
    branches: [main, lota-next]
    tags: ['v*']
  workflow_dispatch:

# default every job to read-only
# write scopes Pages needs are granted on the deploy job alone
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    # skip release-candidate tags
    # only main and stable releases are hosted
    if: ${{ !contains(github.ref, '-rc') }}
    runs-on: ubuntu-24.04
    # build only reads the repository and produces an artifact
    permissions:
      contents: read
    steps:
      - name: Checkout stable (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 0  # need the tag history for the version label
          persist-credentials: false  # no git auth is needed past checkout

      - name: Checkout development (lota-next)
        uses: actions/checkout@v4
        with:
          ref: lota-next
          path: dev
          fetch-depth: 0  # short-sha for the development version label
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation toolchain
        run: pip install -r stable/Documentation/requirements.txt

      # on a tag build use the tag itself
      # otherwise use the latest stable tag reachable from main
      - name: Resolve labels
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "stable=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "stable=$(git -C stable describe --tags --abbrev=0 --match 'v*' --exclude '*-rc*')" >> "$GITHUB_OUTPUT"
          fi
          echo "dev=lota-next ($(git -C dev rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"

      - name: Build stable channel
        env:
          LOTA_DOCS_CHANNEL: stable
          LOTA_DOCS_REF: main
          LOTA_DOCS_VERSION: ${{ steps.ver.outputs.stable }}
        run: make -C stable/Documentation html

      - name: Build development channel
        env:
          LOTA_DOCS_CHANNEL: dev
          LOTA_DOCS_REF: lota-next
          LOTA_DOCS_VERSION: ${{ steps.ver.outputs.dev }}
        run: make -C dev/Documentation html

      # assemble one tree:
      # stable at the root, development under /lota-next/ the stable build
      # carries the CNAME (html_extra_path) at the site root
      - name: Assemble site
        run: |
          mkdir site
          cp -r stable/Documentation/_build/html/. site/
          mkdir site/lota-next
          cp -r dev/Documentation/_build/html/. site/lota-next/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write  # publish the built artifact to Pages
      id-token: write  # mint the OIDC token deploy-pages presents to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
