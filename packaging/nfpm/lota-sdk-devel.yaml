# SPDX-License-Identifier: MIT
# nfpm config for the lota-sdk-devel package (integrator surface)
#
# Headers, unversioned linker symlinks and the Proton/Steam helper scripts
# for building against the SDK
# Versioned runtime libraries live in lota-sdk, which this package depends on
name: lota-sdk-devel
arch: amd64
platform: linux
version: ${LOTA_VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: Szymon Wilczek <swilczek.lx@gmail.com>
vendor: LOTA
homepage: https://github.com/szymonwilczek/lota
license: MIT
description: |
  LOTA SDK development files
  Headers, the .so linker aliases and Proton/Steam integration helpers for
  building against the gaming, anti-cheat and server SDKs. Requires lota-sdk.
changelog: ./build/changelog.gen.yaml

overrides:
  rpm:
    depends:
      - lota-sdk
      - pkgconfig(libcrypto)

contents:
  # unversioned libX.so linker symlinks only;
  # nfpm preserves each as the symlink the build made
  # (libX.so -> libX.so.MAJOR.MINOR.PATCH)
  # versioned targets are shipped by lota-sdk
  - src: ./build/liblotagaming.so
    dst: /usr/lib64/liblotagaming.so
  - src: ./build/liblotaserver.so
    dst: /usr/lib64/liblotaserver.so
  - src: ./build/liblota_wine_hook.so
    dst: /usr/lib64/liblota_wine_hook.so
  - src: ./build/liblota_anticheat.so
    dst: /usr/lib64/liblota_anticheat.so
  - src: ./include/lota_gaming.h
    dst: /usr/include/lota/lota_gaming.h
    file_info:
      mode: 0644
  - src: ./include/lota_wine_hook.h
    dst: /usr/include/lota/lota_wine_hook.h
    file_info:
      mode: 0644
  - src: ./include/lota_server.h
    dst: /usr/include/lota/lota_server.h
    file_info:
      mode: 0644
  - src: ./include/lota_anticheat.h
    dst: /usr/include/lota/lota_anticheat.h
    file_info:
      mode: 0644
  - src: ./include/lota_token.h
    dst: /usr/include/lota/lota_token.h
    file_info:
      mode: 0644
  - src: ./include/lota_snapshot.h
    dst: /usr/include/lota/lota_snapshot.h
    file_info:
      mode: 0644
  - src: ./build/pkgconfig/lota-gaming.pc
    dst: /usr/lib64/pkgconfig/lota-gaming.pc
    file_info:
      mode: 0644
  - src: ./build/pkgconfig/lota-server.pc
    dst: /usr/lib64/pkgconfig/lota-server.pc
    file_info:
      mode: 0644
  - src: ./build/pkgconfig/lota-anticheat.pc
    dst: /usr/lib64/pkgconfig/lota-anticheat.pc
    file_info:
      mode: 0644
  - src: ./build/pkgconfig/lota-wine-hook.pc
    dst: /usr/lib64/pkgconfig/lota-wine-hook.pc
    file_info:
      mode: 0644
  - src: ./scripts/lota-proton-hook
    dst: /usr/bin/lota-proton-hook
    file_info:
      mode: 0755
  - src: ./scripts/lota-steam-setup
    dst: /usr/bin/lota-steam-setup
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/licenses/lota-sdk-devel/LICENSE
    type: license
    file_info:
      mode: 0644
