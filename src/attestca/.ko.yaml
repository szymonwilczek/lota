# ko build configuration for the LOTA attestation CA OCI image.
#
# Default attest-CA build is pure Go and links static.
# pkcs11/HSM signing path is an opt-in cgo build (GO_TAGS=pkcs11) that
# needs a PKCS#11 module at runtime, so it is deliberately left out of
# the image -- HSM adopters run the CA on a host with their module,
# not in this container.
#
# ko builds reproducible distroless image without a Dockerfile or the
# Docker daemon; build it through `make container-image-attest-ca`.
#
# Nonroot distroless static base carries no shell, libc or package manager,
# and the CA signing material must be supplied through a mounted volume.
defaultBaseImage: gcr.io/distroless/static:nonroot
builds:
  - id: lota-attest-ca
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
