# SPDX-License-Identifier: MIT
# LOTA PCR Policy - Testing Environment
#
# No PCR pin, hash list or require_* check. The verifier refuses it unless
# started with --allow-permissive-policy.

name: testing
description: "Testing policy - minimal requirements for development"

# PCR 14 is still checked against the boot commitment
pcrs: {}

kernel_hashes: []
agent_hashes: []

require_iommu: false
require_enforce: false
require_module_sig: false
require_secureboot: false
require_lockdown: false
require_ima_appraisal: false
require_cmdline_policy: false
