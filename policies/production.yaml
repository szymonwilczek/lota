# SPDX-License-Identifier: MIT
# LOTA PCR Policy - Production Template
#
# The raw PCR pins ship commented out; pick one road before going live:
# pin real PCR 0/1/7 values for a fleet of identical machines, or leave them
# unpinned and let require_secureboot anchor each device's first boot
# baseline. On the second road pin agent_hashes too: with no PCR pin and no
# agent hash, the first agent hash a device reports becomes its baseline
# unchecked, so a modified agent that enforces nothing could attest, and the
# verifier refuses that policy unless started with --allow-unpinned-agent
# (INSECURE). A policy that pins no PCR, kernel hash or agent hash is also
# refused unless started with --allow-permissive-policy (INSECURE), so the
# file as shipped loads only with both flags.
#
# Collect values on a reference host with
#   sudo lota-agent --export-policy > my-policy.yaml
# which prints the PCRs, the kernel image digest the boot loader measured,
# the agent hash (sha256sum /usr/bin/lota-agent) and the host's require_*
# state.
#
# PCR 0 holds the firmware, PCR 1 its configuration, PCR 7 the Secure Boot
# state; a kernel signed by the same key leaves PCR 7 as it was. PCR 8 holds
# the GRUB kernel command line; on systemd-boot or a UKI it is in PCR 12.
# Leave PCR 14 out: the verifier checks it against the boot commitment
# derived from the agent hash.

name: production
description: "Production policy - customize PCR values for your environment"

# enterprise (the default) refuses a device whose PCR 0/1/7 drifted from
# its baseline until an operator clears the device's row. consumer re-pins
# the baseline on its own when the drift keeps the Secure Boot root of
# trust, as a BIOS update on a machine you do not own does; it needs
# require_secureboot. The verifier's -enable-self-service-reanchor, when
# given, overrides this key for every policy.
profile: enterprise

# Expected PCR values (SHA-256, 64 hex characters).
#
# Identical machines: uncomment and pin PCR 0/1/7; a device that does not
# match is refused. Machines with their own firmware each: leave them
# commented out, since a pin matches one device only and PCR 8 hashes the
# per-machine root=UUID; require_secureboot and require_cmdline_policy below
# check every device the same way, and profile: consumer re-pins a baseline
# after a firmware update. Do not use consumer with raw PCR 0/1/7 pins.
pcrs:
  # 0: "REPLACE_WITH_REAL_PCR0_FROM_lota-agent_--export-policy"
  # 1: "REPLACE_WITH_REAL_PCR1_FROM_lota-agent_--export-policy"
  # 7: "REPLACE_WITH_REAL_PCR7_FROM_lota-agent_--export-policy"
  # PCR 8 (identical machines, GRUB only; pin 12 on systemd-boot/UKI):
  # 8: "REPLACE_WITH_REAL_PCR8_FROM_lota-agent_--export-policy"

# Kernel image digests as the boot loader measured them into PCR 9. When
# the list is set, a device whose quote does not cover a measured kernel
# image in PCR 9, or whose image is not listed, is refused. Every kernel
# update needs a new entry; PCR 7 and PCR 8 bind the kernel without one.
kernel_hashes: []

# SHA-256 of each agent binary the fleet runs; add one per agent release.
agent_hashes:
  # - "sha256_of_lota_agent_v1"

# The next five are flags the agent sets in its report.
require_iommu: true # IOMMU DMA remapping on
require_enforce: true # the agent runs in enforce mode
require_module_sig: false # kernel enforces module signatures
require_lockdown: false # kernel lockdown integrity or confidentiality
# The agent finds an appraise rule on BPRM_CHECK, or with no func=, in the
# kernel's loaded IMA policy, and Secure Boot on or ima_appraise=enforce or
# fix on the command line.
require_ima_appraisal: false

# Both checks read the event log the quote binds, so they need no per-device
# pin. require_secureboot needs the firmware-measured SecureBoot variable on;
# the agent's own Secure Boot flag does not count.
require_secureboot: true
# Every kernel command line GRUB measured into PCR 8 must be free of the
# built-in denylist (init=, rd.break, lockdown=none, ...) and cmdline_deny.
# A quote without PCR 8 is refused; a PCR 8 that is zero with no measured
# command line, as on systemd-boot or a UKI, skips the check.
require_cmdline_policy: true
# Entries added to the built-in denylist; '-' and '_' match each other:
#   "param"   - bare flag or any valued form
#   "param="  - any value
#   "param=v" - exact key=value pair
cmdline_deny: []
