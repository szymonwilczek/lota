# SPDX-License-Identifier: MIT
# LOTA PCR Policy - Production Template
#
# WARNING: This file ships with placeholder PCR values. The verifier
# REJECTS attestations from clients whose PCR 0/1/7 do not match a pin
# in this file unless the operator opts in to TOFU boot enrollment
# explicitly (see policies/README.md, "Boot enrollment ceremony").
# Replace the placeholders below with real values from your hardware.
#
# How to collect values:
#   Full policy:   sudo lota-agent --export-policy > my-policy.yaml
#   Kernel hash:   sha256sum /boot/vmlinuz-$(uname -r) | cut -d' ' -f1
#   Agent hash:    sha256sum /usr/sbin/lota-agent | cut -d' ' -f1
#
# PCR meanings (SHA-256):
#   PCR 0:   SRTM, BIOS/UEFI firmware measurements
#   PCR 1:   UEFI configuration data (NVRAM-resident BIOS settings)
#   PCR 7:   Secure Boot state (policies and certificates) - the
#            maintenance-free signed-kernel anchor: a kernel signed by a
#            trusted key keeps the same PCR 7 across updates
#   PCR 8:   kernel command line + boot config (GRUB). Pinning it rejects a
#            signed kernel booted with a sabotaged cmdline (init=, lockdown=,
#            module.sig_enforce=). On systemd-boot/UKI the cmdline lands in
#            PCR 12 - pin 12 there instead of 8.
#   PCR 14:  LOTA agent self-measurement (boot-commitment derived,
#            never TOFU under the production verifier default)

name: production
description: "Production policy - customize PCR values for your environment"

# Expected PCR values (SHA-256 hex-encoded, 64 chars).
# PCR 0/1/7 are REQUIRED under VerifierConfig.RequireBootEnrollment=true
# (the production default). Leaving them as placeholders means the
# verifier rejects every client until the operator either pins real
# values here or runs `lota-agent --export-policy` on a known-good host.
pcrs:
  0: "REPLACE_WITH_REAL_PCR0_FROM_lota-agent_--export-policy"
  1: "REPLACE_WITH_REAL_PCR1_FROM_lota-agent_--export-policy"
  7: "REPLACE_WITH_REAL_PCR7_FROM_lota-agent_--export-policy"
  # PCR 8: kernel cmdline integrity on GRUB (recommended). Stays stable
  # across kernel updates because the cmdline rarely changes.
  # Capture with `lota-agent --export-policy`.
  # Remove this line on systemd-boot/UKI hosts and pin 12 instead.
  8: "REPLACE_WITH_REAL_PCR8_FROM_lota-agent_--export-policy"

# Allowed kernel image hashes (SHA-256).
# ADVISORY ONLY, NOT a trust control: this hash is the agent's userspace
# sha256(/boot/vmlinuz), self-reported by code running on the kernel, so a
# compromised kernel can spoof it. The kernel trust anchor is PCR 7 (signed
# kernel) plus PCR 8 (cmdline) above.
# Leave empty in production; populating it does not add real assurance and
# forces a per-kernel maintenance treadmill.
kernel_hashes: []

# Allowed LOTA agent binary hashes (SHA-256)
# Update when deploying new agent versions
agent_hashes:
  # - "sha256_of_lota_agent_v1"

# Security requirements - enable what your infrastructure supports
require_iommu: true # DMA protection via IOMMU/VT-d
require_enforce: true # LSM (SELinux/AppArmor) in enforce mode
require_module_sig: false # Signed kernel modules (distribution-dependent)
require_secureboot: false # UEFI Secure Boot (requires hardware support)
require_lockdown: false # Kernel lockdown mode
