# SPDX-License-Identifier: MIT
# LOTA PCR Policy - Strict Security
#
# High-security policy requiring ALL security features enabled.
# Suitable for competitive gaming, esports, and money tournaments.
#
# Requirements:
#   - IOMMU/VT-d enabled in BIOS and kernel
#   - SELinux or AppArmor in enforce mode
#   - Kernel module signature enforcement enabled
#   - UEFI Secure Boot enabled
#   - Kernel lockdown mode active
#
# Before deployment, verify system meets requirements:
#   lota-agent --verify-security-state

name: strict
description: "Strict security policy - all protections required"

# Owned fleet:
# firmware drift is a finding, so drifted boot baseline waits for operator rather
# than re-anchoring itself.
# Set `consumer` for fleet of machines you do not own (see policies/README.rst)
profile: enterprise

# Critical PCR values that MUST match.
#
# All three boot PCRs are REQUIRED under VerifierConfig.RequireBootEnrollment=true
# (the production default). The strict profile rejects any host whose
# firmware, UEFI configuration, or Secure Boot state drifts from the
# pinned values below; that is the whole point of this profile.
pcrs:
  # PCR 0: SRTM firmware measurements; changes indicate firmware update
  0: "REPLACE_WITH_REAL_PCR0_FROM_lota-agent_--export-policy"
  # PCR 1: UEFI configuration / NVRAM-resident BIOS settings
  1: "REPLACE_WITH_REAL_PCR1_FROM_lota-agent_--export-policy"
  # PCR 7: Secure Boot policies + certificates; the signed-kernel anchor
  7: "REPLACE_WITH_REAL_PCR7_FROM_lota-agent_--export-policy"
  # PCR 8: kernel cmdline + boot config (GRUB). Rejects a signed kernel
  # booted with a tampered cmdline. On systemd-boot/UKI pin 12 instead of 8.
  8: "REPLACE_WITH_REAL_PCR8_FROM_lota-agent_--export-policy"

# Kernel image hashes are ADVISORY ONLY, not a trust control: the value is
# the agent's self-reported userspace sha256(/boot/vmlinuz), spoofable by a
# compromised kernel. Trust the kernel through PCR 7 (signed) + PCR 8
# (cmdline), not this list. Leave empty.
kernel_hashes: []

# Only specifically approved agent versions
agent_hashes:
  # Add SHA-256 hashes of approved agent builds

# ALL SECURITY FEATURES REQUIRED
require_iommu: true
require_enforce: true
require_module_sig: true
require_secureboot: true # event-log enforced (firmware-measured SecureBoot variable)
require_lockdown: true
require_cmdline_policy: true # event-log enforced kernel cmdline denylist (PCR 8)
cmdline_deny: []
