# SPDX-License-Identifier: MIT
# LOTA PCR Policy - Strict Security
#
# Every require_* check on, with PCR 0/1/7 pinned. A host must show
# require_iommu, require_enforce, require_module_sig, require_secureboot,
# require_lockdown and require_ima_appraisal true in
#
#   sudo lota-agent --export-policy | grep '^require_'
#
# require_enforce there is the mode the configuration or --mode sets, not
# the running agent's and not the SELinux or AppArmor mode.

name: strict
description: "Strict security policy - all protections required"

# A drifted boot baseline waits for an operator unless the verifier runs
# with -enable-self-service-reanchor; see production.yaml for consumer.
profile: enterprise

# A host whose PCR 0, 1 or 7 differs from these values is refused.
pcrs:
  # firmware
  0: "REPLACE_WITH_REAL_PCR0_FROM_lota-agent_--export-policy"
  # firmware configuration
  1: "REPLACE_WITH_REAL_PCR1_FROM_lota-agent_--export-policy"
  # Secure Boot state
  7: "REPLACE_WITH_REAL_PCR7_FROM_lota-agent_--export-policy"

# Left empty: no kernel image is bound. See production.yaml.
kernel_hashes: []

agent_hashes:
  # SHA-256 of each agent binary the fleet runs

require_iommu: true
require_enforce: true
require_module_sig: true
require_secureboot: true
require_lockdown: true
# needs an appraise rule on BPRM_CHECK, or with no func=, in the host's IMA
# policy, and Secure Boot on or ima_appraise=enforce or fix on the command
# line
require_ima_appraisal: true
require_cmdline_policy: true
cmdline_deny: []
