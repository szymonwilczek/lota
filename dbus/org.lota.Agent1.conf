<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Only root may own org.lota.Agent1; root and the lota group may send to
  it and receive its signals. Ping and GetStatus answer the lota group;
  GetToken answers root only, and returns the status flags rather than a
  token, which comes from /run/lota/lota.sock.
-->
<busconfig>

  <policy user="root">
    <allow own="org.lota.Agent1"/>
    <allow send_destination="org.lota.Agent1"/>
    <allow receive_sender="org.lota.Agent1"/>
  </policy>

  <policy group="lota">
    <allow send_destination="org.lota.Agent1"/>
    <allow receive_sender="org.lota.Agent1"/>
  </policy>

</busconfig>
